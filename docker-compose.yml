services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${DB_DATABASE:-licitaciones_abbi}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./modelo_bd.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds/ubicaciones_geograficas.sql:/docker-entrypoint-initdb.d/02-seed-ubicaciones.sql:ro
      - ./database/seeds/admin_usuario.sql:/docker-entrypoint-initdb.d/03-seed-admin.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    profiles: [dev]
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      NODE_ENV: production
      SWAGGER_ENABLED: "false"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  mariadb_data:
