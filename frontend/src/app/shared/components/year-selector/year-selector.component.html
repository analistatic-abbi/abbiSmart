<div class="year-selector">
  <button type="button" class="year-selector__btn" (click)="anterior.emit()" aria-label="Año anterior">
    <span class="material-symbols-outlined">chevron_left</span>
  </button>
  <span class="year-selector__value">{{ anio() }}</span>
  <button type="button" class="year-selector__btn" (click)="siguiente.emit()" aria-label="Año siguiente">
    <span class="material-symbols-outlined">chevron_right</span>
  </button>
</div>
