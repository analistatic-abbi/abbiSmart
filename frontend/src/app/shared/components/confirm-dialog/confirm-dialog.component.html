@if (dialog.state(); as state) {
  <div class="confirm-backdrop" (click)="cancelar()">
    <div
      class="confirm-dialog"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-labelledby]="'confirm-dialog-title'"
      (click)="$event.stopPropagation()"
    >
      <h3 id="confirm-dialog-title">{{ state.title }}</h3>
      <p>{{ state.message }}</p>
      <div class="confirm-dialog__actions">
        <button type="button" class="btn-secondary" (click)="cancelar()">
          {{ state.cancelLabel }}
        </button>
        <button
          type="button"
          [class]="state.variant === 'danger' ? 'btn-danger' : 'btn-primary'"
          (click)="confirmar()"
        >
          {{ state.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
