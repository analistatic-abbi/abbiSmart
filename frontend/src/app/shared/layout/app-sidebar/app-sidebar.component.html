<nav
  class="app-sidebar"
  [class.app-sidebar--mobile-open]="mobileOpen()"
>
  <div class="app-sidebar__main">
    @for (section of sections(); track section.title) {
      <div
        class="app-sidebar__section"
        [class.app-sidebar__section--collapsed]="isSectionCollapsed(section.title)"
        [class.app-sidebar__section--active]="sectionHasActiveRoute(section)"
      >
        <button
          type="button"
          class="app-sidebar__section-toggle"
          (click)="toggleSection(section.title)"
          [attr.aria-expanded]="!isSectionCollapsed(section.title)"
        >
          <span class="app-sidebar__section-title">{{ section.title }}</span>
          <span class="material-symbols-outlined app-sidebar__section-chevron">
            expand_more
          </span>
        </button>

        @if (!isSectionCollapsed(section.title)) {
          <div class="app-sidebar__section-items">
            @for (item of section.items; track item.route) {
              <a
                class="app-sidebar__item"
                [routerLink]="item.route"
                routerLinkActive="app-sidebar__item--active"
                [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
                (click)="mobileClose.emit()"
              >
                <span class="material-symbols-outlined">{{ item.icon }}</span>
                <span>{{ item.label }}</span>
              </a>
            }
          </div>
        }
      </div>
    }
  </div>

  <div class="app-sidebar__footer">
    <button class="app-sidebar__item app-sidebar__item--button" type="button" (click)="openSupport(); mobileClose.emit()">
      <span class="material-symbols-outlined">support_agent</span>
      <span>Soporte</span>
    </button>
    <button class="app-sidebar__logout" type="button" (click)="logout()">
      <span class="material-symbols-outlined">logout</span>
      <span>Cerrar sesión</span>
    </button>
  </div>
</nav>
