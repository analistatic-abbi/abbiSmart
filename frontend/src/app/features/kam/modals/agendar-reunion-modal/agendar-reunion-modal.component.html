<app-abbi-modal
  title="Agendar reunión de fin de ronda"
  [open]="open()"
  [loading]="loading()"
  confirmLabel="Agendar"
  cancelLabel="Cancelar"
  (confirm)="onConfirm()"
  (cancel)="onCancel()"
>
  <p class="modal-hint">
    Indique la fecha en la que se realizará la reunión de cierre de esta ronda KAM.
  </p>

  <label>
    Fecha de reunión
    <input
      type="date"
      [ngModel]="fecha() || fechaInicial()"
      (ngModelChange)="fecha.set($event)"
    />
  </label>
</app-abbi-modal>
