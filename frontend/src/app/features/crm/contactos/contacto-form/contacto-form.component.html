<section class="page">
  <a class="back" routerLink="/crm/contactos">← Volver a contactos</a>

  <header class="page__header">
    <div>
      <h1>{{ isEdit() ? 'Editar contacto' : 'Nuevo contacto' }}</h1>
    </div>
  </header>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <div class="panel form-grid">
    @if (!isEdit()) {
      <label>Cliente
        <app-searchable-select
          [options]="clienteOptions()"
          [ngModel]="clienteId()"
          (ngModelChange)="clienteId.set($event)"
          placeholder="Seleccione..."
          searchPlaceholder="Buscar cliente..."
        />
      </label>
    }

    <label class="full">
      Nombre
      <input
        type="text"
        [ngModel]="nombre()"
        (ngModelChange)="onNombreChange($event)"
        (blur)="onNombreBlur()"
      />
    </label>

    @if (mostrarDuplicados()) {
      <app-duplicado-alerta
        class="full"
        tipo="contacto"
        [sugerencias]="duplicados()"
        (dismissed)="mostrarDuplicados.set(false)"
      />
    }
    <label>Cargo <input type="text" [ngModel]="cargo()" (ngModelChange)="cargo.set($event)" /></label>
    <label>Teléfono <input type="text" [ngModel]="telefono()" (ngModelChange)="telefono.set($event)" /></label>
    <label>Correo <input type="email" [ngModel]="correo()" (ngModelChange)="correo.set($event)" /></label>

    <label>Departamento
      <select [ngModel]="departamento()" (ngModelChange)="onDepartamentoChange($event)">
        <option value="">Seleccione...</option>
        @for (d of departamentos(); track d) {
          <option [value]="d">{{ d }}</option>
        }
      </select>
    </label>

    <label>Municipio
      <select [ngModel]="ubicacionId()" (ngModelChange)="ubicacionId.set(+$event || null)">
        <option [ngValue]="null">Seleccione...</option>
        @for (m of municipios(); track m.id) {
          <option [ngValue]="m.id">{{ m.municipio }}</option>
        }
      </select>
    </label>
  </div>

  <div class="form-actions">
    <a class="btn-secondary" routerLink="/crm/contactos">Cancelar</a>
    <button type="button" class="btn-primary" [disabled]="loading()" (click)="guardar()">Guardar</button>
  </div>
</section>
