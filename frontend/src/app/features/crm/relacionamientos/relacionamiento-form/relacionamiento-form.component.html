<section class="page">
  <a class="back" routerLink="/crm/relacionamientos">← Volver a relacionamientos</a>

  <header class="page__header">
    <div>
      <h1>Nuevo relacionamiento</h1>
      <p>Registre la interacción; el resultado oficial se define al editar cuando se conozca el desenlace.</p>
    </div>
  </header>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <div class="panel form-grid">
    <label>Contacto
      <app-searchable-select
        [options]="contactoOptions()"
        [ngModel]="contactoId()"
        (ngModelChange)="contactoId.set($event)"
        placeholder="Seleccione..."
        searchPlaceholder="Buscar contacto..."
      />
    </label>

    <label>Canal
      <select [ngModel]="canal()" (ngModelChange)="canal.set($event)">
        @for (c of canales; track c) { <option [value]="c">{{ c }}</option> }
      </select>
    </label>

    <label class="full">Mensaje <textarea [ngModel]="mensaje()" (ngModelChange)="mensaje.set($event)"></textarea></label>
    <label>Fecha mensaje <input type="date" [ngModel]="fechaMensaje()" (ngModelChange)="fechaMensaje.set($event)" /></label>
    <label>Fecha de alerta sin respuesta
      <input
        type="date"
        [min]="fechaMensaje() || null"
        [ngModel]="fechaAlertaRespuesta()"
        (ngModelChange)="fechaAlertaRespuesta.set($event)"
      />
    </label>
    <p class="field-hint full">En esta fecha se notificará al emisor si aún no hay respuesta registrada.</p>
  </div>

  <div class="form-actions">
    <a class="btn-secondary" routerLink="/crm/relacionamientos">Cancelar</a>
    <button type="button" class="btn-primary" [disabled]="loading()" (click)="guardar()">Guardar</button>
  </div>
</section>
