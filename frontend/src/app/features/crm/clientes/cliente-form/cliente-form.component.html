<section class="page">
  <a class="back" routerLink="/crm/clientes">← Volver a clientes</a>

  <header class="page__header">
    <h1>{{ isEdit() ? 'Editar cliente' : 'Nuevo cliente' }}</h1>
  </header>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <div class="panel form-grid">
    <label class="full">
      Empresa
      <input
        type="text"
        [ngModel]="empresa()"
        (ngModelChange)="onEmpresaChange($event)"
        (blur)="onEmpresaBlur()"
      />
    </label>

    @if (mostrarDuplicados()) {
      <app-duplicado-alerta
        class="full"
        tipo="cliente"
        [sugerencias]="duplicados()"
        (dismissed)="mostrarDuplicados.set(false)"
      />
    }

    <label>{{ etiquetaGeoNivel1() }}
      <select [ngModel]="departamento()" (ngModelChange)="onDepartamentoChange($event)">
        <option value="">Seleccione...</option>
        @for (d of departamentos(); track d) {
          <option [value]="d">{{ d }}</option>
        }
      </select>
    </label>

    <label>{{ etiquetaGeoNivel2() }}
      <app-searchable-select
        [options]="municipioOptions()"
        [ngModel]="ubicacionId()"
        (ngModelChange)="ubicacionId.set($event)"
        placeholder="Seleccione..."
        searchPlaceholder="Buscar..."
        emptyMessage="Seleccione un departamento primero"
      />
    </label>

    <label>Segmento
      <select [ngModel]="segmento()" (ngModelChange)="segmento.set($event)">
        @for (s of segmentos(); track s.codigo) {
          <option [value]="s.codigo">{{ s.etiqueta }}</option>
        }
      </select>
    </label>

    @if (segmento() === segmentoOtro) {
      <label>Segmento otro <input type="text" [ngModel]="segmentoOtroValor()" (ngModelChange)="segmentoOtroValor.set($event)" /></label>
    }
  </div>

  <div class="form-actions">
    <a class="btn-secondary" routerLink="/crm/clientes">Cancelar</a>
    <button type="button" class="btn-primary" [disabled]="loading()" (click)="guardar()">
      {{ loading() ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</section>
