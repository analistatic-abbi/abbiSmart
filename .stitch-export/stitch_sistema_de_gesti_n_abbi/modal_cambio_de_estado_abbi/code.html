<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Cambio de Estado - Gestión ABBI</title>
<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect">

                    "on-secondary": "#ffffff",

                    "on-surface": "#1a1c1f",
                    "on-primary-fixed-variant": "#204873",
                    "surface-dim": "#dadade",
                    "on-secondary-fixed-variant": "#2e4869",
                    "on-background": "#1a1c1f",
                    "surface-container": "#eeedf1",

                    "surface-container-lowest": "#ffffff",

                    "primary-fixed": "#d2e4ff",

                    "primary": "#002546",
                    "on-primary": "#ffffff",
                    "secondary-fixed": "#d3e4ff",
                    "inverse-primary": "#a4c9fb",
                    "on-secondary-fixed": "#001c38",
                    "surface-variant": "#e2e2e6",
                    "surface-container-highest": "#e2e2e6",
                    "outline": "#73777f",
                    "error": "#ba1a1a",

            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "xl": "32px",
                    "margin-mobile": "16px",
                    "sm": "8px",
                    "lg": "24px",
                    "margin-desktop": "32px",
                    "gutter": "16px",

                    "xs": "4px",

            },
            "fontFamily": {

                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],

          }

<style>
        /* Ambient subtle pattern for the background canvas behind the modal */
        body {
            background-color: #f9f9fd;
            background-image: radial-gradient(#c3c6d0 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="antialiased min-h-screen text-on-surface">
<!-- Modal Overlay Backdrop (Nivel 2 Interacción) -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-inverse-surface/60 backdrop-blur-[2px] p-margin-mobile md:p-margin-desktop transition-opacity duration-300">
<!-- Modal Container (Nivel 1 Superficie) -->
<div class="bg-surface w-full max-w-lg rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.08)] border border-outline-variant flex flex-col overflow-hidden animate-[modalFadeIn_0.2s_ease-out]">
<!-- Header -->
<div class="px-lg py-md border-b border-outline-variant flex justify-between items-center bg-surface-bright">
<h2 class="font-h3 text-h3 text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" data-icon="sync_alt">sync_alt</span>
                    Cambiar estado del proceso
                </h2>
<button aria-label="Cerrar modal" class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high rounded-full p-1 transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
</div>
<!-- Body -->
<div class="p-lg flex flex-col gap-lg bg-surface">
<!-- Current State Badge Area -->
<div class="flex items-center justify-between p-md bg-surface-container-low rounded-lg border border-outline-variant/50">
<div class="flex flex-col gap-1">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wide">Estado Actual</span>
<span class="font-body-md text-body-md font-semibold text-on-surface">Validación Técnica</span>
</div>
<!-- Badge Component -->
<div class="px-3 py-1.5 bg-secondary-container text-on-secondary-container rounded-full flex items-center gap-2 border border-secondary-container/50">
<span class="material-symbols-outlined text-[16px]" data-icon="hourglass_top">hourglass_top</span>
<span class="font-label-sm text-label-sm font-semibold">En Proceso</span>
</div>
</div>
<!-- Divider -->
<div class="h-[1px] w-full bg-outline-variant/30"></div>
<!-- Form Controls -->
<form class="flex flex-col gap-md">
<!-- Dropdown for Transitions -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1" for="new_state">
                            Seleccionar Nuevo Estado <span aria-hidden="true" class="text-error">*</span>
</label>
<div class="relative">
<select class="w-full appearance-none bg-surface border border-outline-variant rounded-lg px-md py-[10px] font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary focus:border-secondary transition-all cursor-pointer hover:bg-surface-container-low" id="new_state" required="">
<option disabled="" selected="" value="">Elija una transición válida...</option>
<option value="aprobado">Aprobado - Mover a Adjudicación</option>
<option value="revision">Devolver a Revisión Inicial</option>
<option value="rechazado">Rechazado - Cierre de Proceso</option>
<option value="suspendido">Suspendido Temporalmente</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Justification Textarea -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="justification">
                            Justificación o Comentarios (Opcional)
                        </label>
<textarea class="w-full bg-surface border border-outline-variant rounded-lg px-md py-[10px] font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary focus:border-secondary transition-all resize-none placeholder:text-on-surface-variant/50" id="justification" placeholder="Añada notas relevantes sobre este cambio de estado..." rows="3"></textarea>
</div>
</form>
</div>
<!-- Footer Actions -->
<div class="px-lg py-md border-t border-outline-variant bg-surface-container flex justify-end gap-md">
<button class="px-md py-2 bg-surface border border-outline-variant text-primary-container font-button text-button rounded-lg hover:bg-surface-container-high transition-colors focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface focus:outline-none" type="button">
                    Cancelar
                </button>
<button class="px-md py-2 bg-primary-container text-on-primary font-button text-button rounded-lg hover:bg-primary transition-colors flex items-center gap-2 shadow-sm focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-surface focus:outline-none" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="check_circle">check_circle</span>
                    Cambiar estado
                </button>
</div>
</div>
</div>
<style>
        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</body></html>
