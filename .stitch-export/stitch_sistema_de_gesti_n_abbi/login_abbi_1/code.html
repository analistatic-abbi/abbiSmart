<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
</head>
<body class="h-full bg-surface font-body-md text-on-surface antialiased flex flex-col justify-center py-12 sm:px-6 lg:px-8">
<div class="sm:mx-auto sm:w-full sm:max-w-md">
<!-- Logo -->
<div class="flex justify-center">
<img alt="ABBI Logo" class="h-16 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCX_CZArZqa9qvS5_P9k4uu62lrZqdNz1vIb80RW84L5gmjEKzsf1f-9xA67sQSPQC_Xr7KSfAYro0-CdRA46atpmpQ3G9ddNwpWsVQeymyfBr3XwzDlf2u5gg4oasrBarT7MExBoA2LVoP14KLa6xYSebbegc6csqFpwpKzGluhDYRL2Cz9ZrvLps2qwrm9hAynj3yep11xK67MChESfN3d-SCTDsMGsW0xQmLR2Lw_dFXp8AqNpgPd2V0BkDDVXhO8g"/>
</div>
<h2 class="mt-6 text-center text-h2 font-h2 text-on-surface tracking-tight">
            Iniciar sesión
        </h2>
<p class="mt-2 text-center text-body-md font-body-md text-on-surface-variant">
            Accede al panel de control de ABBI
        </p>
</div>
<div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
<div class="bg-surface-container-lowest py-lg px-lg shadow-[0px_4px_12px_rgba(0,0,0,0.08)] rounded-login border border-outline-variant sm:px-10 relative overflow-hidden">
<!-- Subtle top accent line for PrimeNG feel -->
<div class="absolute top-0 left-0 w-full h-[3px] bg-primary-container"></div>
<form action="#" class="space-y-6" method="POST">
<!-- Email Input -->
<div>
<label class="block text-label-sm font-label-sm text-on-surface mb-xs" for="email">
                        Correo electrónico
                    </label>
<div class="mt-1 relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">mail</span>
</div>
<input autocomplete="email" class="block w-full pl-10 h-10 border-outline-variant rounded-login focus:ring-secondary-container focus:border-secondary-container text-body-md font-body-md placeholder:text-outline-variant text-on-surface bg-surface-container-lowest transition-colors shadow-sm" id="email" name="email" placeholder="usuario@empresa.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block text-label-sm font-label-sm text-on-surface mb-xs" for="password">
                        Contraseña
                    </label>
<div class="mt-1 relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">lock</span>
</div>
<input autocomplete="current-password" class="block w-full pl-10 pr-10 h-10 border-outline-variant rounded-login focus:ring-secondary-container focus:border-secondary-container text-body-md font-body-md placeholder:text-outline-variant text-on-surface bg-surface-container-lowest transition-colors shadow-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer hover:text-on-surface-variant text-outline-variant transition-colors" onclick="togglePasswordVisibility()">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility_off</span>
</div>
</div>
</div>
<!-- Extras -->
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-primary-container focus:ring-primary-container border-outline-variant rounded-[4px] cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-label-sm font-label-sm text-on-surface-variant cursor-pointer" for="remember-me">
                            Recordarme
                        </label>
</div>
<div class="text-label-sm font-label-sm">
<a class="font-button text-primary hover:text-primary-container transition-colors" href="#">
                            ¿Olvidaste tu contraseña?
                        </a>
</div>
</div>
<!-- Submit Button -->
<div>
<button class="w-full flex justify-center items-center py-2 px-4 border border-transparent rounded-login shadow-sm text-button font-button text-on-primary bg-primary-container hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container h-10 transition-colors" type="submit">
                        Iniciar sesión
                        <span class="material-symbols-outlined ml-2 text-[20px]">login</span>
</button>
</div>
</form>
<div class="mt-6">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest text-label-sm font-label-sm text-on-surface-variant">
                            Acceso seguro
                        </span>
</div>
</div>
</div>
</div>
<p class="mt-8 text-center text-label-sm font-label-sm text-outline-variant">
            © 2024 ABBI Sistemas. Todos los derechos reservados.
        </p>
</div>
<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility_off';
            }
        }
    </script>
</body></html>
