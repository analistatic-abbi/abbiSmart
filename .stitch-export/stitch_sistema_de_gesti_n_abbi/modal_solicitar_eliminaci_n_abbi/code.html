        body { font-family: 'Inter', sans-serif; }

<body class="bg-background min-h-screen flex items-center justify-center p-4">
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-on-surface/40 backdrop-blur-sm z-40 transition-opacity"></div>
<!-- Modal Container -->
<div aria-labelledby="modal-title" aria-modal="true" class="relative bg-surface rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.08)] border border-outline-variant w-full max-w-md mx-auto z-50 flex flex-col" role="dialog">
<!-- Header -->
<div class="flex items-center justify-between px-lg py-md border-b border-outline-variant">
<div class="flex items-center gap-3 text-error">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">warning</span>
<h2 class="font-h3 text-h3 text-on-surface" id="modal-title">Solicitar eliminación</h2>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-1 rounded-full hover:bg-surface-variant">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Body -->
<div class="p-lg">
<p class="font-body-md text-body-md text-on-surface-variant mb-6">
                Por favor, indícanos el motivo por el cual deseas solicitar la eliminación de este registro. Esta acción será revisada por un administrador.
            </p>
<form class="space-y-4">
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-2" for="motivo">Motivo de la solicitud <span class="text-error">*</span></label>
<textarea class="w-full px-3 py-2 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow resize-none" id="motivo" name="motivo" placeholder="Describe detalladamente el motivo..." required="" rows="4"></textarea>
</div>
</form>
</div>
<!-- Footer -->
<div class="flex items-center justify-end gap-3 px-lg py-md border-t border-outline-variant bg-surface-container-lowest rounded-b-xl">
<button class="px-4 py-2 h-10 font-button text-button text-primary-container bg-surface border border-outline-variant rounded-lg hover:bg-surface-variant transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1" type="button">
                Cancelar
            </button>
<button class="px-4 py-2 h-10 font-button text-button text-on-primary bg-primary-container rounded-lg hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 shadow-sm flex items-center gap-2" type="submit">
<span>Enviar solicitud</span>
<span class="material-symbols-outlined text-[18px]">send</span>
</button>
</div>
</div>
