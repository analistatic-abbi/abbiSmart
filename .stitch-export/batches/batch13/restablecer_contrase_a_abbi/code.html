<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Nueva Contraseña -->
<div class="flex flex-col gap-xs">
<label class="font-button text-button text-on-surface" for="new-password">Nueva contraseña</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>

</button>

<div class="flex-1 bg-surface-container-high transition-colors duration-300" id="str-2"></div>
<div class="flex-1 bg-surface-container-high rounded-r-full transition-colors duration-300" id="str-3"></div>

<script>
        // Simple strength indicator logic for demo purposes
        const passwordInput = document.getElementById('new-password');
        const str1 = document.getElementById('str-1');
        const str2 = document.getElementById('str-2');
        const str3 = document.getElementById('str-3');
        const strText = document.getElementById('strength-text');

        passwordInput.addEventListener('input', function(e) {
            const val = e.target.value;
            const length = val.length;
            const hasUpper = /[A-Z]/.test(val);
            const hasNumber = /[0-9]/.test(val);
            
            // Reset colors
            str1.className = 'flex-1 rounded-l-full transition-colors duration-300 bg-surface-container-high';
            str2.className = 'flex-1 transition-colors duration-300 bg-surface-container-high';
            str3.className = 'flex-1 rounded-r-full transition-colors duration-300 bg-surface-container-high';
            strText.textContent = 'Ninguna';
            strText.className = 'font-label-sm text-label-sm font-semibold text-outline';

            if (length > 0) {
                let score = 0;
                if (length >= 8) score++;
                if (hasUpper) score++;
                if (hasNumber) score++;

                if (score === 1 || (length > 0 && length < 8)) {
                    str1.classList.replace('bg-surface-container-high', 'bg-error');
                    strText.textContent = 'Débil';
                    strText.classList.replace('text-outline', 'text-error');
                } else if (score === 2) {
                    str1.classList.replace('bg-surface-container-high', 'bg-yellow-500');
                    str2.classList.replace('bg-surface-container-high', 'bg-yellow-500');
                    strText.textContent = 'Media';
                    strText.classList.replace('text-outline', 'text-yellow-600');
                } else if (score >= 3) {
                    str1.classList.replace('bg-surface-container-high', 'bg-green-600');
                    str2.classList.replace('bg-surface-container-high', 'bg-green-600');
                    str3.classList.replace('bg-surface-container-high', 'bg-green-600');
                    strText.textContent = 'Fuerte';
                    strText.classList.replace('text-outline', 'text-green-700');
                }
            }
        });
    </script>
