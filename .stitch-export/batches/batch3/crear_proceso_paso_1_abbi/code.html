<!DOCTYPE html><html class="light" lang="es"><head>

<style>
        /* Custom form styles based on guidance */
        .prime-input {
            @apply w-full h-10 px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:ring-2 focus:ring-[#2E8EC2] focus:border-transparent font-body-md text-on-surface transition-all;
        }
        .prime-label {
            @apply block mb-1 font-button text-on-surface-variant;
        }
        .prime-radio {
            @apply w-4 h-4 text-[#0E3B65] bg-surface-container-lowest border-outline-variant focus:ring-[#2E8EC2];
        }
        .prime-btn-primary {
            @apply h-10 px-6 bg-[#0E3B65] text-white rounded-[6px] font-button hover:bg-primary transition-colors flex items-center justify-center gap-2;
        }
        .prime-btn-secondary {
            @apply h-10 px-6 bg-white text-[#0E3B65] border border-outline-variant rounded-[6px] font-button hover:bg-surface-container-low transition-colors flex items-center justify-center gap-2;
        }
        
        /* Stepper styles */
        .stepper-item-active .stepper-circle {
            @apply bg-[#0E3B65] text-white border-[#0E3B65];
        }
        .stepper-item-active .stepper-text {
            @apply text-[#0E3B65] font-button;
        }
        .stepper-item-inactive .stepper-circle {
            @apply bg-surface-container-lowest text-on-surface-variant border-outline-variant;
        }
        .stepper-item-inactive .stepper-text {
            @apply text-on-surface-variant font-body-md;
        }
    </style>
</head>
<body class="bg-[#F8F9FA] text-on-surface font-body-md min-h-screen flex flex-col">
<!-- TopNavBar (Shared Component) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-lg bg-surface-container-lowest border-b border-outline-variant h-16 shadow-sm">
<div class="flex items-center gap-4">
<!-- Back button since it's a linear process -->
<button class="p-2 hover:bg-surface-container-low rounded-full transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex items-center gap-2">
<img alt="ABBI Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDcUycfRmk58GCkOBUGgcQB9QyzmD_JBYIdohPWDhy6iyqLYjG48-XstpeSkqF84XOMnfCpITnC1_9aPC6hmDpS3pw2iQ8Y6JfRsIRwjqw39T7U9f4gVLKeXdoQySp5AKqAsvIkVPrFbyN8TFAQ_MBMN5aPZ9sAtJR--8IaS7Fq3M2h0OvA8oPtFDVRF3KQM7ROA3DBi8zZ9XsdJFiLUsUQ7s4SKyiR1prafek5O6pqzzVvZQk--ra8eXJX5zWf3PKlqw">
<span class="font-h2 text-h2 font-bold text-primary dark:text-primary-fixed hidden md:block">ABBI</span>
</div>
</div>
<div class="flex items-center gap-4">
<!-- Role Badge -->
<span class="hidden md:inline-flex items-center px-2 py-1 rounded bg-surface-container-low text-[#233E5E] font-label-sm border border-outline-variant">
                Administrador
            </span>
<!-- Actions -->
<button class="p-2 hover:bg-surface-container-low rounded-full transition-colors text-on-surface-variant relative">
<span class="material-symbols-outlined">notifications</span>
<span class="absolute top-2 right-2 w-2 h-2 bg-[#BE5535] rounded-full"></span>
</button>
<button class="p-2 hover:bg-surface-container-low rounded-full transition-colors text-on-surface-variant hidden md:block">
<span class="material-symbols-outlined">flag</span>
</button>
<!-- User Profile -->
<div class="flex items-center gap-2 border-l border-outline-variant pl-4 ml-2">
<div class="w-8 h-8 rounded-full bg-primary-container text-white flex items-center justify-center font-button">
                    NU
                </div>
<div class="hidden md:flex flex-col">
<span class="font-label-sm text-on-surface">Nombre de Usuario</span>
<a class="text-[10px] text-primary hover:underline cursor-pointer select-none" href="#">Cerrar Sesión</a>
</div>
</div>
</div>
</header>
<!-- Main Content Canvas (No SideNav as per Linear/Transactional intent rule) -->
<main class="flex-1 mt-16 p-margin-mobile md:p-margin-desktop flex justify-center">
<div class="w-full max-w-[1024px] flex flex-col gap-6">
<!-- Page Header & Stepper Container -->
<div class="flex flex-col gap-6 bg-surface-container-lowest p-lg rounded-lg border border-outline-variant shadow-sm">
<div>
<h1 class="font-h1 text-h1 text-primary">Crear Proceso</h1>
<p class="font-body-md text-on-surface-variant mt-1">Complete la información general del nuevo proceso.</p>
</div>
<!-- Stepper -->
<div class="flex items-center justify-between relative w-full pt-4 pb-2">
<!-- Connecting Lines -->
<div class="absolute top-8 left-[10%] right-[10%] h-[2px] bg-outline-variant -z-10"></div>
<div class="absolute top-8 left-[10%] right-[50%] h-[2px] bg-outline-variant -z-10 transition-all" id="stepper-progress"></div>
<!-- Step 1 -->
<div class="flex flex-col items-center gap-2 stepper-item-active w-1/3 z-10 bg-surface-container-lowest">
<div class="w-8 h-8 rounded-full border-2 flex items-center justify-center stepper-circle transition-colors">
                            1
                        </div>
<span class="stepper-text text-center text-[12px] md:text-sm">Datos generales</span>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center gap-2 stepper-item-inactive w-1/3 z-10 bg-surface-container-lowest">
<div class="w-8 h-8 rounded-full border-2 flex items-center justify-center stepper-circle transition-colors bg-surface-container-lowest">
                            2
                        </div>
<span class="stepper-text text-center text-[12px] md:text-sm">Indicadores financieros</span>
</div>
<!-- Step 3 -->
<div class="flex flex-col items-center gap-2 stepper-item-inactive w-1/3 z-10 bg-surface-container-lowest">
<div class="w-8 h-8 rounded-full border-2 flex items-center justify-center stepper-circle transition-colors bg-surface-container-lowest">
                            3
                        </div>
<span class="stepper-text text-center text-[12px] md:text-sm">Documentación</span>
</div>
</div>
</div>
<!-- Form Formulario -->
<div class="bg-surface-container-lowest p-lg rounded-lg border border-outline-variant shadow-sm">
<form class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-6">
<!-- ID Digitado -->
<div class="col-span-1">
<label class="prime-label" for="id_proceso">ID Digitado <span class="text-error">*</span></label>
<input class="prime-input" id="id_proceso" placeholder="Ej: PR-2023-001" required="" type="text">
</div>
<!-- Empresa -->
<div class="col-span-1 md:col-span-2 lg:col-span-1">
<label class="prime-label" for="empresa">Empresa Cliente <span class="text-error">*</span></label>
<div class="relative">
<select class="prime-input appearance-none pr-10" id="empresa" required="">
<option disabled="" selected="" value="">Seleccione una empresa...</option>
<option value="1">Cliente Alpha S.A.</option>
<option value="2">Corporación Beta</option>
<option value="3">Industrias Gamma</option>
<option value="otro">Otro (Especificar)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Spacer for grid alignment if needed, or expand previous fields -->
<div class="col-span-1 md:col-span-2 lg:col-span-3 h-[1px] bg-outline-variant my-2"></div>
<!-- Departamento -->
<div class="col-span-1">
<label class="prime-label" for="departamento">Departamento <span class="text-error">*</span></label>
<div class="relative">
<select class="prime-input appearance-none pr-10" id="departamento" required="">
<option disabled="" selected="" value="">Seleccione...</option>
<option value="antioquia">Antioquia</option>
<option value="bogota">Bogotá D.C.</option>
<option value="valle">Valle del Cauca</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Municipio -->
<div class="col-span-1">
<label class="prime-label" for="municipio">Municipio <span class="text-error">*</span></label>
<div class="relative">
<select class="prime-input appearance-none pr-10" disabled="" id="municipio" required="">
<option disabled="" selected="" value="">Seleccione departamento primero</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<div class="col-span-1 md:col-span-2 lg:col-span-3 h-[1px] bg-outline-variant my-2"></div>
<!-- Portal de origen -->
<div class="col-span-1">
<label class="prime-label" for="portal">Portal de Origen</label>
<input class="prime-input" id="portal" placeholder="SECOP II, Portal Privado, etc." type="text">
</div>
<!-- Link -->
<div class="col-span-1 md:col-span-2">
<label class="prime-label" for="link">Link del Proceso</label>
<input class="prime-input" id="link" placeholder="https://..." type="url">
</div>
<!-- Cuantía -->
<div class="col-span-1">
<label class="prime-label" for="cuantia">Cuantía (Valor Estimado) <span class="text-error">*</span></label>
<div class="relative">
<span class="absolute left-3 top-2.5 text-on-surface-variant font-body-md">$</span>
<input class="prime-input pl-8" id="cuantia" placeholder="0.00" required="" type="text">
</div>
</div>
<!-- Segmento -->
<div class="col-span-1">
<label class="prime-label" for="segmento">Segmento <span class="text-error">*</span></label>
<div class="relative">
<select class="prime-input appearance-none pr-10" id="segmento" required="">
<option disabled="" selected="" value="">Seleccione segmento...</option>
<option value="1">Tecnología e Información</option>
<option value="2">Infraestructura</option>
<option value="3">Salud</option>
<option value="4">Servicios Generales</option>
<option value="5">Consultoría</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<div class="col-span-1 md:col-span-2 lg:col-span-3 h-[1px] bg-outline-variant my-2"></div>
<!-- Tipo de proceso -->
<div class="col-span-1">
<label class="prime-label">Tipo de Proceso <span class="text-error">*</span></label>
<div class="flex gap-4 mt-2 h-10 items-center">
<label class="flex items-center gap-2 cursor-pointer">
<input class="prime-radio" name="tipo_proceso" required="" type="radio" value="periodico">
<span class="font-body-md">Periódico</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input class="prime-radio" name="tipo_proceso" type="radio" value="no_periodico">
<span class="font-body-md">No Periódico</span>
</label>
</div>
</div>
<!-- Tipo de instrumento -->
<div class="col-span-1">
<label class="prime-label" for="instrumento">Tipo de Instrumento <span class="text-error">*</span></label>
<div class="relative">
<select class="prime-input appearance-none pr-10" id="instrumento" required="">
<option disabled="" selected="" value="">Seleccione instrumento...</option>
<option value="rfi">RFI (Request for Information)</option>
<option value="cotizacion">Cotización</option>
<option value="licitacion">Licitación</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Plazo de ejecución -->
<div class="col-span-1">
<label class="prime-label" for="plazo">Plazo de Ejecución (Meses)</label>
<input class="prime-input" id="plazo" min="1" placeholder="Ej: 12" step="1" type="number">
</div>
<div class="col-span-1 md:col-span-2 lg:col-span-3 h-[1px] bg-outline-variant my-2"></div>
<!-- Experiencia Requerida -->
<div class="col-span-1 lg:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-6">
<div class="col-span-1">
<label class="prime-label">¿Requiere Experiencia Específica?</label>
<div class="flex gap-4 mt-2 h-10 items-center">
<label class="flex items-center gap-2 cursor-pointer">
<input class="prime-radio" id="exp_si" name="experiencia" onchange="toggleObservacion()" type="radio" value="si">
<span class="font-body-md">Sí</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input checked="" class="prime-radio" id="exp_no" name="experiencia" onchange="toggleObservacion()" type="radio" value="no">
<span class="font-body-md">No</span>
</label>
</div>
</div>
<!-- Observación Experiencia (Conditional) -->
<div class="col-span-1 md:col-span-2 hidden transition-all duration-300" id="obs_container">
<label class="prime-label" for="observacion">Observación de Experiencia</label>
<textarea class="prime-input h-auto resize-none" id="observacion" placeholder="Describa brevemente los requisitos de experiencia..." rows="3"></textarea>
</div>
</div>
</form>
</div>
<!-- Actions Footer -->
<div class="flex justify-end gap-4 mt-2 mb-8">
<button class="prime-btn-secondary" type="button">
                    Cancelar
                </button>
<button class="prime-btn-primary" type="button">
                    Siguiente
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</main>
<script>
        function toggleObservacion() {
            const expSi = document.getElementById('exp_si');
            const obsContainer = document.getElementById('obs_container');
            
            if (expSi.checked) {
                obsContainer.classList.remove('hidden');
                obsContainer.classList.add('block');
            } else {
                obsContainer.classList.add('hidden');
                obsContainer.classList.remove('block');
            }
        }
    </script>
</body></html>
